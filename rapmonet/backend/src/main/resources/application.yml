rapmonet:
  version: '@project.version@'
  securite:
    # Clé de l'empreinte des numéros de carte. À DÉFINIR en production (variable RAPMONET_CLE_EMPREINTE_CARTE).
    cle-empreinte-carte: ${RAPMONET_CLE_EMPREINTE_CARTE:cle-de-developpement-a-changer}
    # Clé de chiffrement des secrets de double authentification. À DÉFINIR en production (variable RAPMONET_CLE_CHIFFREMENT).
    cle-chiffrement: ${RAPMONET_CLE_CHIFFREMENT:cle-de-chiffrement-de-developpement}
    admin:
      # Mot de passe du compte « admin » créé au premier démarrage ; à changer à la première connexion.
      mot-de-passe-initial: ${RAPMONET_ADMIN_MOT_DE_PASSE:admin}
  batch:
    # Intégration automatique des journaux GAB (heure et dossiers : écran « Journaux GAB », table parametre_application).
    planification-active: true
    # Un fichier modifié depuis moins de ce délai est en cours de copie : il sera pris au passage suivant.
    delai-stabilite-secondes: 120
    # Fuseau de l'heure d'exécution (vide = fuseau du serveur), ex. Africa/Abidjan
    fuseau-horaire: ${RAPMONET_FUSEAU_HORAIRE:}

spring:
  application:
    name: rapmonet
  datasource:
    url: ${RAPMONET_DB_URL:jdbc:postgresql://localhost:5432/rapmonet}
    username: ${RAPMONET_DB_USER:rapmonet}
    password: ${RAPMONET_DB_PASSWORD:rapmonet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est géré uniquement par Flyway
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Taille maximale des fichiers envoyés (fichiers LIS, VSS…)
---
spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
