name: RAPMONET

on:
  push:
    paths: ['rapmonet/**', '.github/workflows/rapmonet.yml']
  pull_request:
    paths: ['rapmonet/**', '.github/workflows/rapmonet.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rapmonet
          POSTGRES_PASSWORD: rapmonet
          POSTGRES_DB: rapmonet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rapmonet"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: rapmonet/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rapmonet/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rapmonet/frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build
